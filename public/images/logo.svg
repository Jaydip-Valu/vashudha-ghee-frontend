<svg width="240" height="72" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 72">
  <defs>
    <linearGradient id="logoGoldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="logoText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Outer gold ring -->
  <circle cx="36" cy="36" r="33" fill="url(#logoGoldRing)"/>
  <!-- Dark brown inner ring -->
  <circle cx="36" cy="36" r="27" fill="#78350f"/>
  <!-- Cream inner fill -->
  <circle cx="36" cy="36" r="23" fill="url(#logoBg)"/>

  <!-- COW FACE (front view, stylized) -->
  <!-- Face/head oval -->
  <ellipse cx="36" cy="37" rx="12" ry="13" fill="#b45309"/>
  <!-- Muzzle/snout -->
  <ellipse cx="36" cy="44" rx="8" ry="5.5" fill="#d97706"/>
  <!-- Muzzle highlight -->
  <ellipse cx="36" cy="43" rx="6" ry="3.5" fill="#fbbf24" opacity="0.4"/>

  <!-- Left ear -->
  <ellipse cx="21" cy="30" rx="5" ry="7.5" fill="#b45309" transform="rotate(-20 21 30)"/>
  <ellipse cx="21" cy="30" rx="2.8" ry="5" fill="#fde68a" transform="rotate(-20 21 30)"/>
  <!-- Right ear -->
  <ellipse cx="51" cy="30" rx="5" ry="7.5" fill="#b45309" transform="rotate(20 51 30)"/>
  <ellipse cx="51" cy="30" rx="2.8" ry="5" fill="#fde68a" transform="rotate(20 51 30)"/>

  <!-- Left horn (curved, elegant) -->
  <path d="M25 26 C20 19 16 13 22 10" stroke="#92400e" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <!-- Right horn -->
  <path d="M47 26 C52 19 56 13 50 10" stroke="#92400e" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <!-- Horn tips gold accent -->
  <circle cx="22" cy="10" r="2" fill="#d97706"/>
  <circle cx="50" cy="10" r="2" fill="#d97706"/>

  <!-- Eyes -->
  <ellipse cx="30" cy="34" rx="3" ry="3.5" fill="#78350f"/>
  <ellipse cx="42" cy="34" rx="3" ry="3.5" fill="#78350f"/>
  <!-- Eye whites/highlight -->
  <circle cx="31" cy="33" r="1" fill="white" opacity="0.8"/>
  <circle cx="43" cy="33" r="1" fill="white" opacity="0.8"/>

  <!-- Nostrils -->
  <ellipse cx="33" cy="46" rx="1.8" ry="1.2" fill="#92400e"/>
  <ellipse cx="39" cy="46" rx="1.8" ry="1.2" fill="#92400e"/>

  <!-- Small ghee drop on forehead (bindi style) -->
  <path d="M36 22 Q37.5 26 36 28 Q34.5 26 36 22Z" fill="#d97706"/>

  <!-- Brand name VASHUDHA -->
  <text x="80" y="27" font-family="Georgia, 'Times New Roman', serif" font-size="21"
        font-weight="bold" fill="url(#logoText)" letter-spacing="0.3">Vashudha</text>

  <!-- Decorative gold line -->
  <rect x="80" y="33" width="152" height="1.2" fill="#f59e0b" rx="1" opacity="0.8"/>

  <!-- GHEE subtitle -->
  <text x="80" y="50" font-family="Arial, Helvetica, sans-serif" font-size="13"
        font-weight="700" fill="#d97706" letter-spacing="7">GHEE</text>

  <!-- Tagline -->
  <text x="80" y="64" font-family="Arial, Helvetica, sans-serif" font-size="7.5"
        fill="#92400e" letter-spacing="2" opacity="0.75">PURE · BILONA · TRADITIONAL</text>
</svg>

